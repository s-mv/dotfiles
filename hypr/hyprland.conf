monitor=,preferred,auto,1

$terminal = alacritty -o font.size=10
$fileManager = pcmanfm
$menu = fuzzel

exec-once = waybar
# exec-once = ~/.config/waybar/hover.sh
exec-once = nm-applet
exec-once = xss-lock -- i3lock
exec-once = ~/.config/sway/randomwall.sh

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct

bind = , Print, exec, flameshot gui

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 1
    resize_on_border = true 
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = yes
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
    gesture = 3, horizontal, workspace
}

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, [float; move 1080 540; size 720 480] $terminal
bind = $mainMod SHIFT, F, exec, firefox
bind = $mainMod SHIFT, P, exec, firefox --private-window
bind = $mainMod SHIFT, E, exec, $fileManager
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, M, movetoworkspace, special:min
bind = $mainMod SHIFT, M, togglespecialworkspace, min
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, Escape, exec, ~/.config/hypr/powermenu.sh
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen

bind = $mainMod ALT, left,  resizeactive, -20 0
bind = $mainMod ALT, right, resizeactive, 20 0
bind = $mainMod ALT, up,    resizeactive, 0 -20
bind = $mainMod ALT, down,  resizeactive, 0 20
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# bind = $mainMod, H, movefocus, l
# bind = $mainMod, J, movefocus, d
# bind = $mainMod, K, movefocus, u
# bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, left,  movefocus, l
bind = $mainMod SHIFT, down,  movefocus, d
bind = $mainMod SHIFT, up,    movefocus, u
bind = $mainMod SHIFT, right, movefocus, r

bind = $mainMod CTRL, left,  movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up,    movewindow, u
bind = $mainMod CTRL, down,  movewindow, d

bind = SUPER,Tab,cyclenext, # change focus to another window
bind = SUPER,Tab,bringactivetotop, # bring it to the top

bind = $mainMod, right, workspace, e+1
bind = $mainMod, left,  workspace, e-1

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bind = $mainMod CTRL SHIFT, right, movetoworkspace, e+1
bind = $mainMod CTRL SHIFT, left,  movetoworkspace, e-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = xwayland-drag-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:fullscreen = false
    no_initial_focus = on
}
