gesture: swipe left 3   xdotool key super+Left
gesture: swipe right 3  xdotool key super+Right
gesture: swipe up 3     xdotool key ctrl+Tab
gesture: swipe down 3   xdotool key ctrl+shift+Tab

gesture: swipe left 4   i3-msg workspace prev
gesture: swipe right 4  i3-msg workspace next
gesture: swipe up 4     xdotool key super+Escape
gesture: swipe down 4    xdotool key super+d

gesture: pinch out 2    xdotool key ctrl+equal
gesture: pinch in 2     xdotool key ctrl+minus

