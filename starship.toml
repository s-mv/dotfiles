"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 700

palette = "shades"

format = "$directory$character"
right_format = "$git_branch"


[character]
success_symbol = "[δ](green)"
error_symbol   = "[δ](red)"

[git_branch]
symbol = " "
format = "on [$symbol$branch ](lavender)"

[palettes.shades]
green = "#43fa34"
lavender = "#b4befe"

